name: Publish Saturnus kernel release

on:
  workflow_run:
    workflows: ["Build Saturnus Steam Deck kernel"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download successful kernel build artifact
        uses: actions/download-artifact@v4
        with:
          name: saturnus-kernel-install-r${{ github.event.workflow_run.run_number }}
          path: release-assets
          repository: Marctraider/linux-saturnus-steamdeck
          run-id: "${{ github.event.workflow_run.id }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify bundle and derive release tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s linux-saturnus.tar.zst
          test -s manifest.txt
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
          run="$(sed -n 's/^build_id=//p' manifest.txt)"
          kernel_release="$(sed -n 's/^kernel_release=//p' manifest.txt)"
          source_commit="$(sed -n 's/^source_commit=//p' manifest.txt)"
          [[ "$run" == "${{ github.event.workflow_run.run_number }}" ]]
          [[ "$source_commit" == "52f69f990706fa4d0eb0dd08c1b950a42c5dacd7" ]]
          [[ "$kernel_release" == "7.3.1-valve3-saturnus-r${run}-g${source_commit:0:12}-dirty" ]]
          echo "tag=v7.3.1-valve3-saturnus-r${run}" >> "$GITHUB_OUTPUT"
          echo "kernel_release=$kernel_release" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Publish replacement GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Saturnus Kernel r${{ github.event.workflow_run.run_number }}
          body: |
            Saturnus Steam Deck kernel, based on Valve kernel 7.3.1-valve3.

            - Kernel release: ${{ steps.metadata.outputs.kernel_release }}
            - Valve source commit: ${{ steps.metadata.outputs.source_commit }}
            - Build workflow: [run #${{ github.event.workflow_run.run_number }}](https://github.com/Marctraider/linux-saturnus-steamdeck/actions/runs/${{ github.event.workflow_run.id }})
            - Clang + LLD, Polly, Full LTO, O2 and Zen 2 target
            - Complete kallsyms enabled for sched_ext/LAVD
            - Module debug symbols stripped during modules_install
            - Includes the kernel image, module tree, manifest and SHA256 checksum

            Use the repository's installer.sh on SteamOS 3.10.x. The installer
            preserves the existing SteamOS boot paths, creates a new initramfs,
            keeps rollback copies, and does not reboot automatically.
          files: |
            release-assets/linux-saturnus.tar.zst
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false

      - name: Remove superseded r1 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v7.3.1-valve3-saturnus-r1 >/dev/null 2>&1; then
            gh release delete v7.3.1-valve3-saturnus-r1 --cleanup-tag --yes
            echo "Removed superseded Saturnus r1 release and tag."
          else
            echo "Superseded r1 release is already absent."
          fi
